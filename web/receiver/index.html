<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAN Stream</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font:14px system-ui}#join{position:fixed;z-index:1000;inset:0;display:grid;place-items:center;background:#0d1015;pointer-events:auto}.box{width:360px;background:#171b22;padding:22px;border-radius:10px;box-shadow:0 20px 60px #0008}.box input,.box button{display:block;width:100%;height:40px;margin:8px 0;padding:6px;border-radius:6px;position:relative;z-index:1001}.box input{background:#0e1116;color:#fff;border:1px solid #333;pointer-events:auto}.box button{background:#2563eb;color:#fff;border:0;cursor:pointer;pointer-events:auto}.box button:disabled{opacity:.6;cursor:not-allowed}#view{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000;z-index:1}#bar{position:fixed;z-index:1100;left:12px;top:12px;background:#000b;padding:7px;border-radius:6px}#full{position:fixed;z-index:1101;right:12px;bottom:12px}#play{display:none;position:fixed;z-index:1200;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 24px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-size:16px;cursor:pointer}#stats{display:none;position:fixed;z-index:1101;left:12px;bottom:12px;background:#000b;padding:8px}</style></head><body><div id="join"><div class="box"><h2>LAN Stream</h2><input id="name" autocomplete="off" placeholder="Имя ПК"><input id="pin" autocomplete="off" type="password" placeholder="PIN"><button id="go" type="button">Подключиться</button><div id="err"></div></div></div><video id="view" autoplay muted playsinline></video><button id="play" type="button">▶ Запустить трансляцию</button><div id="bar">Введите данные и нажмите «Подключиться»</div><button id="full" type="button">⛶</button><pre id="stats"></pre><script src="app.js"></script></body></html>
