<!doctype html><html lang=ru><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>LAN Stream</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font:14px system-ui}#join{position:fixed;inset:0;display:grid;place-items:center;background:#0d1015}.box{width:360px;background:#171b22;padding:22px;border-radius:10px}.box input,.box button{display:block;width:100%;height:40px;margin:8px 0;padding:6px;border-radius:6px}.box input{background:#0e1116;color:#fff;border:1px solid #333}.box button{background:#2563eb;color:#fff;border:0}#view{width:100%;height:100%;object-fit:contain}#bar{position:fixed;left:12px;top:12px;background:#000b;padding:7px;border-radius:6px}#full{position:fixed;right:12px;bottom:12px}#stats{display:none;position:fixed;left:12px;bottom:12px;background:#000b;padding:8px}</style><div id=join><div class=box><h2>LAN Stream</h2><input id=name placeholder="Имя ПК"><input id=pin type=password placeholder="PIN"><button id=go>Подключиться</button><div id=err></div></div></div><video id=view autoplay playsinline></video><div id=bar>Подключение…</div><button id=full>⛶</button><pre id=stats></pre><script src=app.js></script></html>
