<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAN Desktop Stream</title><style>body{font:14px system-ui;background:#0d1015;color:#eee;max-width:1150px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:380px 1fr;gap:12px}section{background:#171b22;border:1px solid #2b323d;border-radius:10px;padding:16px;margin:12px 0}label{display:block;color:#9aa3b1;margin:8px 0 4px}select,input{width:100%;box-sizing:border-box;height:38px;background:#0e1116;color:#eee;border:1px solid #343b47;border-radius:6px;padding:6px}button{height:38px;background:#2563eb;color:white;border:0;border-radius:6px;padding:0 13px;margin:8px 4px 0 0;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#343b47}.hint{color:#9aa3b1;font-size:12px;margin:5px 0}.warning{color:#fbbf24}.ok{color:#86efac}video{width:100%;height:420px;object-fit:contain;background:#000}.row{display:flex;gap:8px}.row>*{flex:1}.lang{width:auto;min-width:70px;background:#242a34;border:1px solid #39414d}#qr{width:150px;background:white;padding:5px}.receiver{padding:9px;border:1px solid #333;margin:6px 0;border-radius:6px}.receiver button{float:right;margin:0;background:#8b1e1e}.rdiag{font-size:11px;color:#9aa3b1;margin:5px 0 0}.stat{color:#9aa3b1;margin:6px 0}.diag{white-space:pre-wrap;background:#0e1116;border-radius:6px;padding:8px;font-size:12px;color:#9aa3b1}</style></head><body><header><h1>LAN Desktop Stream</h1><button id="lang" class="lang">EN</button></header><div class="grid"><section><h3>Настройки</h3><label>Экран / окно</label><select id=s></select><label>Разрешение</label><select id=r><option>1280x720</option><option selected>1920x1080</option><option>2560x1440</option><option>3840x2160</option></select><div class=row><div><label>Профиль качества</label><select id=q><option value=economy>Экономичный — 3.5 Mbps / 30 FPS</option><option value=balanced selected>Сбалансированный — 6 Mbps / 30 FPS</option><option value=quality>Качество — 10 Mbps / 60 FPS</option><option value=maximum>Максимум — 18 Mbps / 60 FPS</option></select></div></div><div class=row><div><label>FPS</label><select id=f><option>30</option><option selected>60</option><option>90</option><option>120</option><option>144</option></select></div><div><label>Bitrate / receiver</label><select id=b><option value=3500000>3.5 Mbps</option><option value=6000000 selected>6 Mbps</option><option value=10000000>10 Mbps</option><option value=18000000>18 Mbps</option></select></div></div><label>Общий исходящий лимит</label><select id=tb><option value=5000000>5 Mbps</option><option value=10000000 selected>10 Mbps</option><option value=15000000>15 Mbps</option><option value=20000000>20 Mbps</option><option value=30000000>30 Mbps</option></select><div id=budget class="hint">Лимит TX: 10 Mbps • 0 ПК</div><div id=adaptive class="hint">Adaptive: —</div><label>Порт</label><input id=p type=number value=8080 min=1 max=65535><label>PIN</label><input id=pin type=password placeholder="необязательно"><label><input id=a type=checkbox style="width:auto"> Системный звук</label><button id=start>▶ Запустить</button><button id=stop disabled>■ Стоп</button></section><section><h3>Предпросмотр</h3><video id=v autoplay muted playsinline></video><div id=vstat class=stat>—</div><p id=state>Остановлено</p><div class=row><button id=copy disabled>Копировать ссылку</button><button id=diagbtn class=secondary>Диагностика</button></div><p id=url>—</p><p id=fw class=stat>Firewall: —</p><img id=qr alt="QR"></section></div><section><h3>Подключённые ПК <span id=count>0</span></h3><div id=list>Нет подключений</div></section><section><h3>Диагностика сети</h3><div id=diag class=diag>Запустите трансляцию для просмотра состояния.</div><button id="saveLogs" class="secondary">Сохранить логи</button><span id="logPath" class="stat"></span></section><script src=app.js></script></body></html>
