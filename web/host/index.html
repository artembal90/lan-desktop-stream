<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAN Desktop Stream</title><style>body{font:14px system-ui;background:#0d1015;color:#eee;max-width:1050px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center}section{background:#171b22;border:1px solid #2b323d;border-radius:10px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:350px 1fr;gap:12px}label{display:block;color:#9aa3b1;margin:8px 0 4px}select,input{width:100%;box-sizing:border-box;height:38px;background:#0e1116;color:#eee;border:1px solid #343b47;border-radius:6px;padding:6px}button{height:38px;background:#2563eb;color:white;border:0;border-radius:6px;padding:0 13px;margin:8px 4px 0 0}video{width:100%;height:300px;background:#000}.row{display:flex;gap:8px}.row>*{flex:1}#qr{width:150px;background:white;padding:5px}small{color:#8994a5}.lang{width:auto;min-width:70px;background:#242a34;border:1px solid #39414d}.receiver{padding:8px;border:1px solid #333;margin:4px 0;border-radius:6px}</style></head>
<body><header><h1>LAN Desktop Stream</h1><button id="lang" class="lang">EN</button></header>
<div class="grid"><section><h3 data-i18n="settings">Настройки</h3><label data-i18n="source">Источник</label><select id=s></select><label data-i18n="resolution">Разрешение</label><select id=r><option>1280x720</option><option selected>1920x1080</option><option>2560x1440</option><option>3840x2160</option></select><div class=row><div><label data-i18n="fps">FPS</label><select id=f><option>30</option><option selected>60</option><option>90</option><option>120</option><option>144</option></select></div><div><label data-i18n="bitrate">Битрейт</label><select id=b><option value=8000000>8 Mbps</option><option value=12000000>12 Mbps</option><option value=20000000 selected>20 Mbps</option><option value=30000000>30 Mbps</option><option value=50000000>50 Mbps</option></select></div></div><label data-i18n="port">Порт</label><input id=p type=number value=8080><label data-i18n="pin">PIN</label><input id=pin type=password placeholder="необязательно" data-placeholder="pinOptional"><p><label><input id=a type=checkbox style="width:auto"> <span data-i18n="audio">Системный звук</span></label></p><button id=start>▶ <span data-i18n="start">Запустить</span></button><button id=stop disabled>■ <span data-i18n="stop">Стоп</span></button></section>
<section><h3 data-i18n="preview">Предпросмотр</h3><video id=v autoplay muted playsinline></video><p id=state>Остановлено</p><p id=url>—</p><img id=qr alt="QR"></section></div>
<section><h3><span data-i18n="receivers">Подключённые ПК</span> <span id=count>0</span></h3><div id=list>Нет подключений</div></section><script src=app.js></script></body></html>
