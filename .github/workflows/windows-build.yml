name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: JavaScript syntax checks
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path src,web -Recurse -Filter '*.js'
          if (-not $files) { throw 'No JavaScript files found.' }
          foreach ($file in $files) {
            Write-Host "Checking $($file.FullName)"
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - name: Electron smoke test (no desktop capture or Firewall changes)
        run: npm run smoke
      - name: Build Windows installer
        run: npm run dist -- --publish never
      - name: Verify packaged source and checksum
        run: node scripts/verify-package.cjs
      - name: WebRTC smoke against packaged app.asar
        run: npm run smoke:package
      - name: NSIS install and application startup (disposable Windows runner only)
        run: npm run smoke:installer
      - name: Verify installer
        shell: pwsh
        run: |
          $file = Get-ChildItem -Path dist -Filter '*Setup.exe' | Select-Object -First 1
          if (-not $file) { throw 'Installer was not produced.' }
          if ($file.Length -lt 100000) { throw "Installer looks invalid: $($file.Length) bytes" }
          Write-Host "Installer: $($file.FullName)"
          Write-Host "Size: $($file.Length) bytes"
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LAN-Desktop-Stream-Windows
          path: |
            dist/*Setup.exe
            dist/*Setup.exe.sha256
            dist/build-manifest.json
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LAN-Desktop-Stream-QA
          path: |
            .test-output/source/*.json
            .test-output/source/*.png
            .test-output/packaged/*.json
            .test-output/packaged/*.png
            .test-output/installer/*.json
            .test-output/installer/*.png
